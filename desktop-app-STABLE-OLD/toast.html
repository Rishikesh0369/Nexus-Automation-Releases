<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    .glass-card {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideUp {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    /* App Logo Styling */
    .app-logo {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2px;
      flex-shrink: 0;
    }
    .title-group {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }
    .app-brand {
      font-size: 11px;
      font-weight: 600;
      color: #38BDF8;
      letter-spacing: 0.3px;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
      color: #F8FAFC;
      letter-spacing: 0.2px;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: #94A3B8;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 5px;
      border-radius: 4px;
      line-height: 1;
      transition: color 0.15s ease;
    }
    .close-btn:hover { color: #FFFFFF; }
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: rgba(255, 255, 255, 0.045);
      padding: 7px 12px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .metric-col {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .metric-col.right {
      align-items: flex-end;
    }
    .label {
      font-size: 9.5px;
      font-weight: 500;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .value {
      font-size: 14px;
      font-weight: 700;
      color: #F8FAFC;
      font-family: 'JetBrains Mono', monospace, sans-serif;
    }
    .val-highlight { color: #34D399; }
  </style>
</head>
<body>
  <div class="glass-card" id="toastCard">
    <div class="card-header">
      <div class="header-left">
        <!-- Project Icon (reads existing assets/icon.png or app logo) -->
        <img src="assets/icon.png" class="app-logo" alt="Nexus" onerror="this.src='../assets/icon.png'; this.onerror=null;">
        <div class="title-group">
          <span class="app-brand">Nexus Automation</span>
          <span class="title">Cancellation Completed</span>
        </div>
      </div>
      <button class="close-btn" id="closeBtn">✕</button>
    </div>
    <div class="metrics-grid">
      <div class="metric-col">
        <span class="label">Total Cancelled</span>
        <span class="value val-highlight" id="cancelledVal">0</span>
      </div>
      <div class="metric-col right">
        <span class="label">Time Taken</span>
        <span class="value" id="timeVal">0m 00s</span>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('toast-data', (event, data) => {
      document.getElementById('cancelledVal').innerText = data.totalCancelled ?? 0;
      document.getElementById('timeVal').innerText = data.timeTaken ?? '0s';
    });
    document.getElementById('closeBtn').addEventListener('click', () => {
      ipcRenderer.send('dismiss-toast');
    });
  </script>
</body>
</html>
