<!DOCTYPE html>
<html>
<head>
<style>
body { background: #080b12; display: flex; gap: 20px; align-items: center; justify-content: center; height: 100vh; }
.brand-logo-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 25%, rgba(56, 189, 248, 0.25), rgba(15, 23, 42, 0.95));
    border: 1.5px solid rgba(56, 189, 248, 0.45);
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.35), inset 0 0 12px rgba(99, 102, 241, 0.25);
    position: relative;
    overflow: hidden;
}
</style>
</head>
<body>
<div class="brand-logo-badge">
    <svg width="26" height="26" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="nexusFlameLeft" x1="12" y1="34" x2="20" y2="4" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#1d4ed8"/>
                <stop offset="50%" stop-color="#0284c7"/>
                <stop offset="100%" stop-color="#38bdf8"/>
            </linearGradient>
            <linearGradient id="nexusFlameRight" x1="28" y1="34" x2="20" y2="4" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#4338ca"/>
                <stop offset="50%" stop-color="#6366f1"/>
                <stop offset="100%" stop-color="#818cf8"/>
            </linearGradient>
            <linearGradient id="nexusCore" x1="20" y1="28" x2="20" y2="14" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="60%" stop-color="#a5f3fc"/>
                <stop offset="100%" stop-color="#ffffff"/>
            </linearGradient>
            <linearGradient id="nexusOrbit" x1="4" y1="20" x2="36" y2="20" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
                <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
            </linearGradient>
            <filter id="coreGlow" x="0" y="0" width="40" height="40" filterUnits="userSpaceOnUse">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
        </defs>

        <!-- Outer Geometric Nexus Hex Ring -->
        <polygon points="20,2 34,10 34,26 20,34 6,26 6,10" 
            stroke="url(#nexusOrbit)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
        
        <!-- Vertex Nodes -->
        <circle cx="20" cy="2" r="1.5" fill="#38bdf8"/>
        <circle cx="34" cy="10" r="1.5" fill="#818cf8"/>
        <circle cx="34" cy="26" r="1.5" fill="#38bdf8"/>
        <circle cx="20" cy="34" r="1.5" fill="#818cf8"/>
        <circle cx="6" cy="26" r="1.5" fill="#38bdf8"/>
        <circle cx="6" cy="10" r="1.5" fill="#818cf8"/>

        <!-- Interconnecting Orbital Nexus Lines -->
        <path d="M6 20 C6 14, 34 14, 34 20 C34 26, 6 26, 6 20 Z" 
            stroke="url(#nexusOrbit)" stroke-width="0.9" stroke-dasharray="2 2" fill="none" opacity="0.4"/>

        <!-- Geometric Gas Nexus Flame - Left Facet -->
        <path d="M20 6 L13 18 C11.5 22 13 28 17 31 L20 33 L20 6 Z" 
            fill="url(#nexusFlameLeft)" opacity="0.95"/>

        <!-- Geometric Gas Nexus Flame - Right Facet -->
        <path d="M20 6 L27 18 C28.5 22 27 28 23 31 L20 33 L20 6 Z" 
            fill="url(#nexusFlameRight)" opacity="0.95"/>

        <!-- Center Ridge Highlight Line -->
        <line x1="20" y1="6" x2="20" y2="33" stroke="#e0f2fe" stroke-width="1" opacity="0.8"/>

        <!-- Inner Plasma Core (Nexus Energy) -->
        <polygon points="20,15 16,23 20,28 24,23" fill="url(#nexusCore)" filter="url(#coreGlow)"/>
        
        <!-- Core Nexus Spark Center -->
        <circle cx="20" cy="22" r="1.8" fill="#ffffff" filter="url(#coreGlow)"/>
    </svg>
</div>
</body>
</html>
