<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Automation running" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="ws" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="0.5" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="52" fill="#050214"/>

  <!-- ============ STATE A: Quasar logo ============ -->
  <g>
    <animate attributeName="opacity"
             values="1;1;0;0;1" keyTimes="0;0.42;0.5;0.92;1"
             dur="8s" repeatCount="indefinite"/>
    <path d="M100 42 L125 82 L165 100 L125 118 L100 158 L75 118 L35 100 L75 82 Z"
          fill="none" stroke="url(#wq)" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="100" cy="100" r="16" fill="url(#ws)"/>
  </g>

  <!-- ============ STATE B: bot at workstation ============ -->
  <g opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1;0" keyTimes="0;0.42;0.5;0.92;1"
             dur="8s" repeatCount="indefinite"/>

    <!-- monitor -->
    <rect x="34" y="28" width="132" height="62" rx="8" fill="none" stroke="#22D3EE" stroke-width="4" opacity="0.75"/>
    <rect x="44" y="42" width="30" height="6" rx="2" fill="url(#ws)">
      <animate attributeName="width" values="14;62;30;54;14" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="44" y="55" width="52" height="6" rx="2" fill="#22D3EE" opacity="0.65">
      <animate attributeName="width" values="52;24;78;38;52" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="44" y="68" width="40" height="6" rx="2" fill="#A78BFA" opacity="0.65">
      <animate attributeName="width" values="40;74;20;60;40" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="92" y="90" width="16" height="8" fill="#22D3EE" opacity="0.5"/>

    <!-- head -->
    <rect x="82" y="100" width="36" height="26" rx="10" fill="none" stroke="url(#wq)" stroke-width="4"/>
    <circle cx="92" cy="112" r="3.6" fill="url(#ws)">
      <animate attributeName="r" values="3.6;0.6;3.6;3.6" keyTimes="0;0.05;0.1;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="108" cy="112" r="3.6" fill="url(#ws)">
      <animate attributeName="r" values="3.6;0.6;3.6;3.6" keyTimes="0;0.05;0.1;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>

    <!-- torso -->
    <rect x="76" y="130" width="48" height="30" rx="8" fill="none" stroke="url(#wq)" stroke-width="4"/>
    <circle cx="100" cy="145" r="6" fill="url(#ws)" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.35;0.85" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- arms -->
    <path d="M76 136 L56 160" stroke="url(#wq)" stroke-width="4.5" stroke-linecap="round">
      <animate attributeName="d" values="M76 136 L56 160;M76 136 L53 152;M76 136 L56 160" dur="0.42s" repeatCount="indefinite"/>
    </path>
    <path d="M124 136 L144 160" stroke="url(#wq)" stroke-width="4.5" stroke-linecap="round">
      <animate attributeName="d" values="M124 136 L144 160;M124 136 L147 152;M124 136 L144 160" dur="0.42s" begin="0.21s" repeatCount="indefinite"/>
    </path>

    <!-- keyboard -->
    <rect x="34" y="162" width="132" height="26" rx="6" fill="none" stroke="#22D3EE" stroke-width="3.5" opacity="0.8"/>
    <rect x="43"  y="168" width="14" height="7" rx="2" fill="url(#ws)"><animate attributeName="opacity" values="1;0.18;0.18;0.18;1" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="62"  y="168" width="14" height="7" rx="2" fill="url(#ws)"><animate attributeName="opacity" values="0.18;1;0.18;0.18;0.18" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="81"  y="168" width="14" height="7" rx="2" fill="url(#ws)"><animate attributeName="opacity" values="0.18;0.18;1;0.18;0.18" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="100" y="168" width="14" height="7" rx="2" fill="url(#ws)"><animate attributeName="opacity" values="0.18;0.18;0.18;1;0.18" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="119" y="168" width="14" height="7" rx="2" fill="url(#ws)"><animate attributeName="opacity" values="0.18;1;0.18;1;0.18" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="138" y="168" width="14" height="7" rx="2" fill="url(#ws)"><animate attributeName="opacity" values="1;0.18;1;0.18;1" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="52" y="179" width="92" height="5" rx="2" fill="#22D3EE" opacity="0.4"/>
  </g>
</svg>
